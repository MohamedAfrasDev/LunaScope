[project]
name = "lunascope"
version = "0.1.0"
description = "LunaScope science service: terrain-aware lunar Sun/Earth visibility"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "rfc8785>=0.1.4",
  "spiceypy>=6",  # independent geometry reference (providers/geometry/spice.py)
  "rasterio>=1.4",  # LOLA DEM reading (dem.py)
  "pyproj>=3.6",  # polar stereographic projection (dem.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lunascope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["SIM115", "C408", "B023", "RUF007", "ISC004"]  # one-off study and report scripts
